name: flutter
description: Flutter/Dart package access plus the Android build dependencies
policies:
  network:
    allow:
      # `flutter upgrade` fetches the SDK's git remote from GitHub, and the
      # Gradle wrapper's distribution download redirects through GitHub to a
      # release-asset host. A deny rule would win over this allow, so applying
      # the profile also clears the legacy global and sandbox-local denies.
      - github.com
      - release-assets.githubusercontent.com
      - objects.githubusercontent.com
      # Dart/Flutter package resolution
      - pub.dev
      - storage.googleapis.com
      # Android SDK/Gradle/AGP dependencies
      - dl.google.com
      - dl-ssl.google.com
      - maven.google.com
      - repo.maven.apache.org
      - repo1.maven.org
      - plugins.gradle.org
      # The Plugin Portal redirects artifact downloads here; allowing only
      # plugins.gradle.org gets a 403 for org.gradle.kotlin / org.jetbrains.kotlin
      # plugin dependencies.
      - plugins-artifacts.gradle.org
      - services.gradle.org
      - downloads.gradle.org
